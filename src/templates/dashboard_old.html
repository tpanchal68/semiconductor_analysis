<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Wafer Process Analytics</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid"><span class="navbar-brand">Semiconductor Analytics Portal</span></div>
    </nav>
    <div class="container">
        <div class="row mb-4 text-center">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm"><h5>Yield</h5><h2 class="text-success">{{ stats.yield }}%</h2></div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm"><h5>Avg V_Min</h5><h2>{{ stats.avg_v_min }}V</h2></div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm"><h5>Total Units</h5><h2>{{ stats.total_die }}</h2></div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6"><img src="data:image/png;base64,{{ yield_plot }}" class="img-fluid rounded shadow"></div>
            <div class="col-md-6"><img src="data:image/png;base64,{{ vmin_plot }}" class="img-fluid rounded shadow"></div>
        </div>
    </div>
</body>
</html>
